[package]
name = "aloud"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3.2"
ort = "=2.0.0-rc.7"
# ort's own Cargo.toml pins ort-sys loosely ("2.0.0-rc.7"), which without
# this line resolves to the newest matching pre-release, ort-sys 2.0.0-rc.13.
# That sys crate's generated bindings are a different (incompatible) ABI
# shape than what ort rc.7's source expects (plain fn pointers vs.
# Option-wrapped), so it fails to compile. Pinning ort-sys to the exact
# rc.7 it was built against fixes this. This does not change the `ort`
# pin above.
ort-sys = "=2.0.0-rc.7"
# ort rc.7 depends on ndarray 0.16 (its Value::from_array/try_extract_tensor
# impls are for 0.16's array types only). Pinning to 0.17 here would put two
# incompatible major ndarray versions in the graph and break every ort
# interop call in the vendored module. Matched to what ort rc.7 actually
# requires.
ndarray = { version = "0.16", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
unicode-normalization = "0.1"
regex = "1.10"
rodio = "0.22.2"
lingua = { version = "1.8.0", default-features = false, features = ["english", "german", "ukrainian", "russian"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"

# Objective-C interop for the macOS Service (NSServices) selection source.
# Target-gated so a non-macOS build never even resolves them. Feature sets
# are the minimum the provider needs — AppKit's default feature set is the
# entire framework.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSPasteboard",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    # The NSError `SMAppService` hands back on a failed register/unregister
    # (src/login_item/macos.rs). Listed here rather than inherited from
    # objc2-service-management's own feature set, which happens to enable
    # it today — this crate names what it uses.
    "NSError",
] }
# SMAppService, for launch-at-login. Same objc2 0.3.x generation as the
# two crates above, so it costs no new bindings generation. Deliberately
# NOT tauri-plugin-autostart: that pins auto-launch 0.5, whose default
# macOS mode writes a LaunchAgent pointing at the inner binary and
# bypasses LaunchServices — which would silently kill the NSServices
# selection path (see src/login_item/mod.rs and CLAUDE.md).
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }

[dev-dependencies]
# Adds `tauri::test` (MockRuntime + `get_ipc_response`) on top of the
# `[dependencies]` tauri above via Cargo feature unification — dev-only,
# so `cargo build --release` (which never links dev-dependencies) is
# unaffected. Used by `src/bin/aloud.rs`'s command_tests to invoke
# `get_settings` through the real invoke pipeline (command-name
# resolution, argument deserialization, response serialization)
# headlessly — see that module's doc comment for what it does and does
# not cover.
tauri = { version = "2.11.5", features = ["test"] }

[[bin]]
name = "aloud-say"
path = "src/bin/aloud_say.rs"

[[bin]]
name = "aloud"
path = "src/bin/aloud.rs"
